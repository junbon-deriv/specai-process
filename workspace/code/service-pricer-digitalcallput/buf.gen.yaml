version: v2
plugins:
  - local: protoc-gen-go
    out: api
    opt:
      - module=github.com/regentmarkets/service-pricer-digitalcallput/api
  - local: protoc-gen-go-grpc
    out: api
    opt:
      - module=github.com/regentmarkets/service-pricer-digitalcallput/api
  - local: protoc-gen-grpc-gateway
    out: api
    opt:
      - module=github.com/regentmarkets/service-pricer-digitalcallput/api
      - generate_unbound_methods=true
