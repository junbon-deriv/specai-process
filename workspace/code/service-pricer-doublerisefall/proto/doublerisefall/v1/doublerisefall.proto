syntax = "proto3";

package doublerisefall.v1;

option go_package = "github.com/regentmarkets/service-pricer-doublerisefall/api/doublerisefall";

// DoubleRiseFallService provides pricing for Double Rise/Fall binary options.
service DoubleRiseFallService {
  // GetAsk calculates the ask price (premium) and payout for a new contract.
  rpc GetAsk(GetAskRequest) returns (GetAskResponse);
  
  // StreamAsk streams real-time ask prices as market data updates.
  rpc StreamAsk(StreamAskRequest) returns (stream GetAskResponse);
  
  // GetBid evaluates the current value of an active contract.
  rpc GetBid(GetBidRequest) returns (GetBidResponse);
  
  // StreamBid streams real-time bid prices for an active contract.
  rpc StreamBid(StreamBidRequest) returns (stream GetBidResponse);
}

// GetAskRequest contains parameters for requesting a contract price.
message GetAskRequest {
  OptionParameters option_parameters = 1;
  optional int64 pricing_time = 2;  // Optional: Unix timestamp for historical pricing
}

// StreamAskRequest contains parameters for streaming contract prices.
message StreamAskRequest {
  OptionParameters option_parameters = 1;
  optional int64 pricing_time = 2;  // Optional: Unix timestamp to start streaming from
}

// GetAskResponse contains the calculated ask price and contract details.
message GetAskResponse {
  string ask_price = 1;            // Contract premium
  string currency = 2;             // Quote currency (e.g., USD)
  string current_spot = 3;         // Current market price
  int64 current_spot_time = 4;     // Timestamp of spot price
  string payout = 5;               // Potential payout amount
  Limits limits = 6;               // Trading limits for the symbol
}

// GetBidRequest contains parameters for evaluating an active contract.
message GetBidRequest {
  OptionParameters option_parameters = 1;
  optional int64 pricing_time = 2;  // Optional: Unix timestamp for evaluation
}

// StreamBidRequest contains parameters for streaming contract values.
message StreamBidRequest {
  OptionParameters option_parameters = 1;
  optional int64 pricing_time = 2;  // Optional: Unix timestamp to start from
}

// GetBidResponse contains the contract value and evaluation details.
message GetBidResponse {
  string bid_price = 1;            // Current contract value (0 or payout)
  bool is_expired = 2;             // Whether contract has expired
  string current_spot = 3;         // Current market price
  int64 current_spot_time = 4;     // Timestamp of current spot
  string entry_spot = 5;           // Entry price (barrier)
  int64 entry_spot_time = 6;       // Timestamp of entry tick
  string exit_spot = 7;            // Exit price (if expired)
  int64 exit_spot_time = 8;        // Timestamp of exit tick
  string barrier = 9;              // Barrier value (same as entry_spot)
  int64 start_time = 10;           // Contract start time
  int64 expiry_time = 11;          // Contract expiry time
  string currency = 12;            // Quote currency
  int64 evaluation_time = 13;      // First evaluation time (t1)
}

// OptionParameters defines the contract specification.
message OptionParameters {
  string symbol = 1;                      // Underlying asset (R_10, R_25, R_50, R_75, R_100)
  ContractType contract_type = 2;         // RISE or FALL
  string currency = 3;                    // Payout currency
  string first_duration = 4;              // Duration to first evaluation (e.g., "1m", "30s", "5t")
  string second_duration = 5;             // Duration to expiry/second evaluation (e.g., "2m", "10t")
  optional int64 start_time = 6;          // Required for Bid requests
  string stake = 7;                       // Premium amount
  optional string payout = 8;             // Required for Bid requests (from Ask response)
}

// ContractType defines the win condition direction.
enum ContractType {
  CONTRACT_TYPE_UNSPECIFIED = 0;
  CONTRACT_TYPE_RISE = 1;   // Win if spot > barrier at both t1 and t2
  CONTRACT_TYPE_FALL = 2;   // Win if spot < barrier at both t1 and t2
}

// Limits contains trading constraints for a symbol.
message Limits {
  string max_payout = 1;    // Maximum allowed payout
  string min_stake = 2;     // Minimum required stake
}
